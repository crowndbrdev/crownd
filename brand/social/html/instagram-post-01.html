<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=block');
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16.000px}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Bricolage Grotesque',system-ui,sans-serif;
  background:#0E0D12;color:#F4F1EA;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;opacity:.07;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.frame{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:4.5rem}
.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:2rem}
.brand{display:flex;align-items:center;gap:1rem;font-weight:800;font-size:2.6rem;letter-spacing:-.06em}
.brand svg{width:3.4rem;height:3.4rem}
.chip{font-family:'JetBrains Mono',monospace;font-size:1.25rem;letter-spacing:.12em;text-transform:uppercase;
  border:2px solid #3A3744;border-radius:999px;padding:.6rem 1.3rem;color:#CFCAC0}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.gold{color:#FFC531}.muted{color:#9C978C}
.h1{font-weight:800;letter-spacing:-.05em;line-height:.9}
.url{font-family:'JetBrains Mono',monospace;font-size:1.6rem}
.dot{display:inline-block;width:1rem;height:1rem;border-radius:50%;background:#FF4A2E;margin-right:.8rem}
.card{border-radius:2.4rem;padding:2.6rem;background:#16151B;border:2px solid #2A2833}
.throne{border:3px solid #FFC531;box-shadow:0 0 0 .6rem rgba(255,197,49,.12)}
.grid20{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.sw{border-radius:1.2rem;padding:1.1rem 1.2rem;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.5rem;display:flex;flex-direction:column;gap:.3rem;min-height:6.2rem;justify-content:flex-end}
.sw small{font-family:'Bricolage Grotesque';font-weight:600;font-size:1.05rem;opacity:.85;line-height:1.1}
.row{display:flex;align-items:center;gap:2rem}
.step{display:flex;gap:2rem;align-items:baseline;padding:1.8rem 0;border-top:2px solid #2A2833}
.step b{font-family:'JetBrains Mono';color:#FFC531;font-size:2rem}
.step h3{font-size:3.2rem;letter-spacing:-.03em}
.step p{font-size:1.7rem;margin-top:.4rem}
.cta{display:inline-block;background:#FFC531;color:#0E0D12;font-weight:800;border-radius:999px;padding:1.2rem 2.4rem;font-size:2rem}
</style></head><body>
<div class="frame">
  <div class="top"><div class="brand">
<svg viewBox="0 0 64 64" fill="#F4F1EA" aria-hidden="true">
  <rect x="10" y="26" width="12" height="26" rx="3"/><rect x="26" y="14" width="12" height="38" rx="3"/>
  <rect x="42" y="32" width="12" height="20" rx="3"/><rect x="8" y="50" width="48" height="7" rx="2"/>
  <circle cx="16" cy="19" r="4.5"/><circle cx="32" cy="6.5" r="5" fill="#FFC531"/><circle cx="48" cy="25" r="4.5"/>
</svg>crownd</div><div class="chip">AO VIVO EM 20 PAÍSES</div></div>
  <div class="content">
      <div class="h1" style="font-size:10rem">20 coroas.</div>
      <div class="serif" style="font-size:9rem;line-height:1">Um mundo.</div>
      <p style="font-size:2rem;max-width:52rem;margin-top:2rem" class="muted">Um leaderboard público de produtos indie por país. Quem paga mais usa a coroa.</p>
      <div class="grid20" style="margin-top:2.4rem;">
        <div class="sw" style="background:#FF3D57;color:#FFFFFF;min-height:6.2rem">US</div><div class="sw" style="background:#E8452C;color:#FFFFFF;min-height:6.2rem">JP</div><div class="sw" style="background:#1D4ED8;color:#FFFFFF;min-height:6.2rem">DE</div><div class="sw" style="background:#0F5C3A;color:#FFFFFF;min-height:6.2rem">GB</div><div class="sw" style="background:#002FA7;color:#FFFFFF;min-height:6.2rem">FR</div><div class="sw" style="background:#FF8F1F;color:#1A1200;min-height:6.2rem">IN</div><div class="sw" style="background:#D40000;color:#FFFFFF;min-height:6.2rem">IT</div><div class="sw" style="background:#0FA39A;color:#FFFFFF;min-height:6.2rem">CA</div><div class="sw" style="background:#00A651;color:#FFFFFF;min-height:6.2rem">BR</div><div class="sw" style="background:#FF2E88;color:#FFFFFF;min-height:6.2rem">KR</div><div class="sw" style="background:#D9622B;color:#FFFFFF;min-height:6.2rem">AU</div><div class="sw" style="background:#1F5FAE;color:#FFFFFF;min-height:6.2rem">ES</div><div class="sw" style="background:#E4007C;color:#FFFFFF;min-height:6.2rem">MX</div><div class="sw" style="background:#3B3BB3;color:#FFFFFF;min-height:6.2rem">ID</div><div class="sw" style="background:#FF6B00;color:#1A0A00;min-height:6.2rem">NL</div><div class="sw" style="background:#0B7A4B;color:#FFFFFF;min-height:6.2rem">SA</div><div class="sw" style="background:#0FA3B1;color:#00191B;min-height:6.2rem">TR</div><div class="sw" style="background:#DA291C;color:#FFFFFF;min-height:6.2rem">CH</div><div class="sw" style="background:#E07B00;color:#1A0E00;min-height:6.2rem">PL</div><div class="sw" style="background:#9E2A20;color:#FFFFFF;min-height:6.2rem">SE</div>
      </div></div>
  <div class="bottom"><span class="url">crownd.dev</span><span class="mono muted" style="font-size:1.3rem">👑 #1</span></div>
</div></body></html>
